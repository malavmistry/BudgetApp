services:
  budgetapp:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Host: ${DB_HOST:-host.docker.internal}
      Database__Port: ${DB_PORT:-1433}
      Database__Name: ${DB_NAME:-BudgetAppDb}
      Database__User: ${DB_USER:-sa}
      Database__Password: ${DB_PASSWORD:?Set DB_PASSWORD in the ignored .env file}
    extra_hosts:
      - "host.docker.internal:host-gateway"
